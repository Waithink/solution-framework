<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案名称 — 微盟售前</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#ffffff; --surface:#f5f6f8; --surface2:#e8eaee;
  --border:#d0d5dd; --accent:#5B3CC4; --accent2:#E85D75;
  --text:#1a1a2e; --text2:#475467; --text3:#98a2b3;
  --green:#039855; --blue:#175CD3; --orange:#DC6803;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,0.06);
}
body{font-family:'Noto Sans SC',sans-serif;background:var(--surface);color:var(--text);overflow:hidden;height:100vh;width:100vw;}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;padding:48px 72px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .4s;overflow-y:auto;background:var(--bg);}
.slide.active{opacity:1;pointer-events:auto;}
.cover{background:linear-gradient(135deg,#0f0f13,#1a1a2e);color:#fff;}
.cover-content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;}
.cover-title{font-size:56px;font-weight:900;margin-bottom:16px;color:#fff;}
.cover-subtitle{font-size:16px;color:#9898b0;margin-bottom:40px;}
.cover-divider{width:60px;height:3px;background:#6c5ce7;margin-bottom:24px;}
.cover-meta{font-size:14px;color:#9898b0;margin-bottom:40px;}
.cover-bottom-text{font-size:12px;color:#5a5a72;letter-spacing:2px;}
h1{font-size:32px;font-weight:700;margin-bottom:8px;}
.subtitle{font-size:14px;color:var(--text2);margin-bottom:20px;}
.source-tag{font-size:12px;color:var(--text2);margin-bottom:16px;padding:3px 10px;background:var(--surface);border-radius:6px;border:1px solid var(--border);display:inline-block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.card.accent{border-left:3px solid var(--accent);background:#faf9ff;}
.card.pink{border-left:3px solid var(--accent2);background:#fff8f9;}
.card.green{border-left:3px solid var(--green);background:#f6fef9;}
.card h4{font-size:15px;font-weight:600;margin-bottom:4px;color:var(--text);}
.card p{font-size:13px;color:var(--text2);line-height:1.5;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1;}
.kpi-row{display:flex;gap:20px;margin-bottom:20px;}
.kpi-item{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;text-align:center;}
.kpi-num{font-size:28px;font-weight:700;color:var(--accent);line-height:1.2;}
.kpi-label{font-size:12px;color:var(--text2);margin-top:4px;}
.slide-counter{position:fixed;bottom:24px;right:32px;font-size:13px;color:var(--text2);z-index:100;background:rgba(255,255,255,.85);padding:4px 14px;border-radius:20px;}
.progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:1000;transition:width .4s;}
@media(max-width:900px){.slide{padding:28px 20px;}.grid-2,.grid-3{grid-template-columns:1fr;}.kpi-row{flex-wrap:wrap;}.kpi-item{min-width:45%;}}
</style>
</head>
<body>
<div class="progress" id="progressBar" style="width:0"></div>
<div class="presentation" id="app"></div>
<div class="slide-counter" id="slideCounter"><span id="currentPage">1</span> / <span id="totalPages">3</span></div>
<script>
const slides = [
  { content: `<div class="cover-content">
    <div style="font-size:13px;color:#6c5ce7;letter-spacing:2px;margin-bottom:24px;">全链路数字化增长方案</div>
    <h1 class="cover-title">品牌名称</h1>
    <p class="cover-subtitle">核心痛点一句话 · 门店规模 · 上线目标</p>
    <div class="cover-divider"></div>
    <div class="cover-meta"><div>微盟售前咨询部</div><div>2026年5月</div></div>
    <div class="cover-bottom-text">微盟 · 让商业更智慧</div>
  </div>` },
  { content: `<div class="source-tag">来源：solution-framework·行业洞察</div>
    <h1>行业痛点与背景</h1>
    <p class="subtitle">客户面临的核心挑战</p>
    <div class="kpi-row">
      <div class="kpi-item"><div class="kpi-num">50亿</div><div class="kpi-label">市场规模</div></div>
      <div class="kpi-item"><div class="kpi-num">15%</div><div class="kpi-label">年增长率</div></div>
      <div class="kpi-item"><div class="kpi-num">50家</div><div class="kpi-label">门店规模</div></div>
      <div class="kpi-item"><div class="kpi-num">10月</div><div class="kpi-label">上线目标</div></div>
    </div>
    <div class="grid-2">
      <div class="card accent"><h4>痛点一</h4><p>具体描述第一行<br>具体描述第二行</p></div>
      <div class="card pink"><h4>痛点二</h4><p>具体描述第一行<br>具体描述第二行</p></div>
    </div>` },
  { content: `<div class="cover-content">
    <h1 class="cover-title">感谢聆听</h1>
    <p class="cover-subtitle">微盟 · 让商业更智慧</p>
    <div class="cover-divider"></div>
    <div class="cover-meta"><div>微盟售前咨询部</div><div>朱鸣超 · weimob@weimob.com</div></div>
  </div>` }
];

let current=0;
const app=document.getElementById('app');
function render(){
  app.innerHTML='';
  slides.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===current?' active':'');
    d.innerHTML=i===0||i===slides.length-1?'<div class="slide cover active">'+s.content+'</div>'.replace('active',i===current?'active':''):s.content;
    if(i===0||i===slides.length-1){
      d.className='slide'+(i===current?' active':'');
      d.innerHTML=s.content;
    }
    app.appendChild(d);
    if(i===0||i===slides.length-1){
      d.classList.add('cover');
    }
  });
  updateNav();
}
function goTo(n){
  document.querySelectorAll('.slide').forEach(e=>e.classList.remove('active'));
  current=(n+slides.length)%slides.length;
  document.querySelectorAll('.slide')[current].classList.add('active');
  updateNav();
}
function nextSlide(){goTo(current+1);}
function prevSlide(){goTo(current-1);}
function updateNav(){
  document.getElementById('currentPage').textContent=current+1;
  document.getElementById('totalPages').textContent=slides.length;
  const pct=((current+1)/slides.length*100).toFixed(1);
  document.getElementById('progressBar').style.width=pct+'%';
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')nextSlide();if(e.key==='ArrowLeft'||e.key==='ArrowUp')prevSlide();});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{const d=tx-e.changedTouches[0].clientX;if(Math.abs(d)>50)d>0?nextSlide():prevSlide();});
render();
</script>
</body>
</html>
